plugins { id "com.android.application" }

android {
    namespace "io.github.jungnamlee.yeongjak"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.jungnamlee.yeongjak"
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName "1.0." + (project.findProperty("versionCode") ?: "1")
    }
    signingConfigs {
        release {
            // 가족용으로 직접 설치하는 앱이라 서명 키를 저장소에 함께 둬요 (업데이트할 때 같은 키가 필요해요)
            storeFile file("release.jks")
            storePassword "yeongjak2026"
            keyAlias "yeongjak"
            keyPassword "yeongjak2026"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "androidx.webkit:webkit:1.11.0" }
