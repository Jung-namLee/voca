name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths: ["writing/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: 앱 화면 파일 넣기
        run: |
          mkdir -p android/app/src/main/assets/www
          cp writing/index.html writing/units.js writing/icon-192.png android/app/src/main/assets/www/
      - name: APK 만들기
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}
      - name: 다운로드 링크에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk yeongjak-master.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app yeongjak-master.apk --title "영작 마스터 (빌드 ${{ github.run_number }})" --notes "폰에서 yeongjak-master.apk를 눌러 받아 설치하세요." --latest
